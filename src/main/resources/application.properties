# -- Server ---------------------------------
server.port=8080

# -- H2 In-Memory Database ------------------
spring.datasource.url=jdbc:h2:mem:pulsedeskdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# -- JPA / Hibernate -------------------------
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# -- H2 Web Console ---------------------------
# Accessible at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# -- Hugging Face API -------------------------
# IMPORTANT: Set an environment variable named HF_TOKEN with your token
# on your system or within your IDE's Run Configuration
# (to run via Docker add it in docker-compose.yml)
# Get token free at https://huggingface.co/settings/tokens
huggingface.api.token=${HF_TOKEN}
huggingface.api.url=https://router.huggingface.co/v1/chat/completions
huggingface.api.model=meta-llama/Llama-3.1-8B-Instruct:novita

# -- Springdoc / Swagger UI -------------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

# -- Logging ----------------------------------
logging.level.com.pulsedesk=DEBUG
logging.level.org.springframework.web=INFO